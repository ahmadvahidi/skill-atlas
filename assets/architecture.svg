 width="720" height="100" rx="14" fill="#0B1220" stroke="#1B2436"/><rect x="80" y="312" width="5" height="100" rx="3" fill="#8C7BFF" opacity="0.9"/><text x="108" y="352" font-family="Poppins" font-size="15" font-weight="600" fill="#8C7BFF" letter-spacing="2" text-anchor="start" opacity="1.0">02</text><text x="154" y="354" font-family="Poppins" font-size="22" font-weight="600" fill="#FFFFFF" letter-spacing="1.6" text-anchor="start" opacity="1.0">AGENTS</text><text x="154" y="384" font-family="Poppins" font-size="15" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">scoped persona + tool permissions, one job each</text><circle cx="766" cy="362.0" r="7" fill="#8C7BFF" opacity="0.75"/><rect x="80" y="434" width="720" height="100" rx="14" fill="#0B1220" stroke="#1B2436"/><rect x="80" y="434" width="5" height="100" rx="3" fill="#7A879E" opacity="0.9"/><text x="108" y="474" font-family="Poppins" font-size="15" font-weight="600" fill="#7A879E" letter-spacing="2" text-anchor="start" opacity="1.0">03</text><text x="154" y="476" font-family="Poppins" font-size="22" font-weight="600" fill="#FFFFFF" letter-spacing="1.6" text-anchor="start" opacity="1.0">COMMANDS</text><text x="154" y="506" font-family="Poppins" font-size="15" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">slash shims — legacy surface, logic lives in skills</text><circle cx="766" cy="484.0" r="7" fill="#7A879E" opacity="0.75"/><rect x="80" y="556" width="720" height="100" rx="14" fill="#0B1220" stroke="#1B2436"/><rect x="80" y="556" width="5" height="100" rx="3" fill="#B7C2D4" opacity="0.9"/><text x="108" y="596" font-family="Poppins" font-size="15" font-weight="600" fill="#B7C2D4" letter-spacing="2" text-anchor="start" opacity="1.0">04</text><text x="154" y="598" font-family="Poppins" font-size="22" font-weight="600" fill="#FFFFFF" letter-spacing="1.6" text-anchor="start" opacity="1.0">RULES</text><text x="154" y="628" font-family="Poppins" font-size="15" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">always-on constraints: immutability, coverage, secrets</text><circle cx="766" cy="606.0" r="7" fill="#B7C2D4" opacity="0.75"/><rect x="80" y="678" width="720" height="100" rx="14" fill="#0B1220" stroke="#1B2436"/><rect x="80" y="678" width="5" height="100" rx="3" fill="#FFC46B" opacity="0.9"/><text x="108" y="718" font-family="Poppins" font-size="15" font-weight="600" fill="#FFC46B" letter-spacing="2" text-anchor="start" opacity="1.0">05</text><text x="154" y="720" font-family="Poppins" font-size="22" font-weight="600" fill="#FFFFFF" letter-spacing="1.6" text-anchor="start" opacity="1.0">HOOKS</text><text x="154" y="750" font-family="Poppins" font-size="15" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">PreToolUse · PostToolUse · Stop · PreCompact</text><circle cx="766" cy="728.0" r="7" fill="#FFC46B" opacity="0.75"/><rect x="900" y="176" width="620" height="590" rx="18" fill="#0A111F" stroke="#1B2436"/><text x="992" y="224" font-family="Poppins" font-size="17" font-weight="600" fill="#FFFFFF" letter-spacing="2.6" text-anchor="start" opacity="1.0">THE PHASE PIPELINE</text><text x="992" y="250" font-family="Poppins" font-size="14" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">one input, one output per phase — never skip, never merge</text><line x1="958" y1="314" x2="958" y2="366" stroke="#1B2436" stroke-width="2"/><circle cx="958" cy="306" r="15" fill="#0E1526" stroke="#2BE3C4" stroke-width="2"/><text x="958" y="311" font-family="Poppins" font-size="13" font-weight="600" fill="#2BE3C4" letter-spacing="0" text-anchor="middle" opacity="1.0">1</text><text x="992" y="312" font-family="Poppins" font-size="19" font-weight="500" fill="#FFFFFF" letter-spacing="1.2" text-anchor="start" opacity="1.0">RESEARCH</text><text x="992" y="334" font-family="Poppins" font-size="14" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">what is true today</text><line x1="958" y1="388" x2="958" y2="440" stroke="#1B2436" stroke-width="2"/><circle cx="958" cy="380" r="15" fill="#0E1526" stroke="#2BE3C4" stroke-width="2"/><text x="958" y="385" font-family="Poppins" font-size="13" font-weight="600" fill="#2BE3C4" letter-spacing="0" text-anchor="middle" opacity="1.0">2</text><text x="992" y="386" font-family="Poppins" font-size="19" font-weight="500" fill="#FFFFFF" letter-spacing="1.2" text-anchor="start" opacity="1.0">PLAN</text><text x="992" y="408" font-family="Poppins" font-size="14" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">phases, risks, files</text><line x1="958" y1="462" x2="958" y2="514" stroke="#1B2436" stroke-width="2"/><circle cx="958" cy="454" r="15" fill="#0E1526" stroke="#2BE3C4" stroke-width="2"/><text x="958" y="459" font-family="Poppins" font-size="13" font-weight="600" fill="#2BE3C4" letter-spacing="0" text-anchor="middle" opacity="1.0">3</text><text x="992" y="460" font-family="Poppins" font-size="19" font-weight="500" fill="#FFFFFF" letter-spacing="1.2" text-anchor="start" opacity="1.0">IMPLEMENT (TDD)</text><text x="992" y="482" font-family="Poppins" font-size="14" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">red › green › refactor</text><line x1="958" y1="536" x2="958" y2="588" stroke="#1B2436" stroke-width="2"/><circle cx="958" cy="528" r="15" fill="#0E1526" stroke="#8C7BFF" stroke-width="2"/><text x="958" y="533" font-family="Poppins" font-size="13" font-weight="600" fill="#8C7BFF" letter-spacing="0" text-anchor="middle" opacity="1.0">4</text><text x="992" y="534" font-family="Poppins" font-size="19" font-weight="500" fill="#FFFFFF" letter-spacing="1.2" text-anchor="start" opacity="1.0">REVIEW</text><text x="992" y="556" font-family="Poppins" font-size="14" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">different pass than the writer</text><line x1="958" y1="610" x2="958" y2="662" stroke="#1B2436" stroke-width="2"/><circle cx="958" cy="602" r="15" fill="#0E1526" stroke="#FFC46B" stroke-width="2"/><text x="958" y="607" font-family="Poppins" font-size="13" font-weight="600" fill="#FFC46B" letter-spacing="0" text-anchor="middle" opacity="1.0">5</text><text x="992" y="608" font-family="Poppins" font-size="19" font-weight="500" fill="#FFFFFF" letter-spacing="1.2" text-anchor="start" opacity="1.0">VERIFY</text><text x="992" y="630" font-family="Poppins" font-size="14" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">gates that actually ran</text><circle cx="958" cy="676" r="15" fill="#0E1526" stroke="#8C7BFF" stroke-width="2"/><text x="958" y="681" font-family="Poppins" font-size="13" font-weight="600" fill="#8C7BFF" letter-spacing="0" text-anchor="middle" opacity="1.0">6</text><text x="992" y="682" font-family="Poppins" font-size="19" font-weight="500" fill="#FFFFFF" letter-spacing="1.2" text-anchor="start" opacity="1.0">COMMIT</text><text x="992" y="704" font-family="Poppins" font-size="14" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="start" opacity="1.0">conventional, scoped</text><path d="M1474 676 L1474 454" stroke="#FFC46B" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 6" fill="none"/><path d="M1468 466 L1474 454 L1480 466" stroke="#FFC46B" stroke-opacity="0.8" stroke-width="2" fill="none"/><rect x="1366" y="480" width="216" height="64" rx="8" fill="#0E1526" stroke="#FFC46B" stroke-opacity="0.35"/><text x="1474" y="504" font-family="Poppins" font-size="14" font-weight="600" fill="#FFC46B" letter-spacing="0" text-anchor="middle" opacity="1.0">gate fails</text><text x="1474" y="526" font-family="Poppins" font-size="13" font-weight="400" fill="#B7C2D4" letter-spacing="0" text-anchor="middle" opacity="1.0">back to implement</text><rect x="80" y="800" width="1440" height="60" rx="12" fill="#0B1